# Sync the repository to an SFTP server on push.
#
# Mirrors the usual VS Code SFTP extension (.vscode/sftp.json) fields:
#   host        -> variable SFTP_HOST
#   port        -> variable SFTP_PORT (default 22)
#   username    -> variable SFTP_USERNAME
#   remotePath  -> variable SFTP_REMOTE_PATH
#   password    -> secret   SFTP_PASSWORD
#
# Optional repository variables:
#   SFTP_SYNC_BRANCH     Branch name for push-triggered runs (e.g. preprod). Manual runs always use branch preprod for checkout.
#   SFTP_LOCAL_PATH      Local glob passed to the action (default: ./*)
#   SFTP_RSYNC_ARGS      Extra rsync flags (default excludes .git, node_modules, .github)
#   SFTP_ONLY            Set to "true" to force SFTP-only mode (recommended)
#   SFTP_DELETE_REMOTE   Set to "true" to delete remote files before upload (dangerous)
#   SFTP_SKIP_IMAGES     Push: omit img/ by default; set to "false" to upload img/. Manual: use the Run workflow checkbox only.
#
# To use GitHub Environments: add `environment: your-env-name` on the job below, then define
# the same variable/secret names on that environment instead of at repository scope.

name: SFTP sync

on:
  push:
    branches:
      - "preprod"
  workflow_dispatch:
    inputs:
      skip_images:
        description: "Append --exclude=img (omit img/ from upload)"
        type: boolean
        default: true

concurrency:
  group: sftp-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sftp-sync:
    environment: preprod
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == vars.SFTP_SYNC_BRANCH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual runs always sync the latest preprod tree, even if you started the run from another branch in the UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'preprod' || github.sha }}

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ vars.SFTP_USERNAME }}
          server: ${{ vars.SFTP_HOST || '1.studio.boardgamearena.com' }}
          port: ${{ vars.SFTP_PORT || '2022' }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: ${{ vars.SFTP_LOCAL_PATH || './*' }}
          remote_path: ${{ vars.SFTP_REMOTE_PATH }}
          sftp_only: 'true'
          delete_remote_files: ${{ vars.SFTP_DELETE_REMOTE == 'true' && 'true' || 'false' }}
          rsyncArgs: ${{ vars.SFTP_RSYNC_ARGS || '--exclude=.git --exclude=node_modules --exclude=.github --exclude=misc --exclude=docs' }}${{ ((github.event_name == 'push' && vars.SFTP_SKIP_IMAGES != 'false') || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_images == 'true')) && ' --exclude=img' || '' }}
